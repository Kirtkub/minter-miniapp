<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mint</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-width: 100%;
      min-height: 100%;
      background: #050505;
      color: #cfcfcf;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { min-height: 100dvh; padding: max(76px, calc(56px + env(safe-area-inset-top))) 20px max(24px, env(safe-area-inset-bottom)); }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #wallet-btn {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      padding: 10px 16px;
      font-size: 13px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
    }
    #wallet-btn:active, .mint-button:active { background: #1c1c1c; }
    #wallet-btn.connected { color: #fff; border-color: #454545; }
    #auth-status-btn {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      padding: 10px 16px;
      font-size: 13px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    #auth-status-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: #6a6a6a; flex: none; }
    #auth-status-btn[data-state="checking"] .dot { background: #6a6a6a; }
    #auth-status-btn[data-state="ok"] { border-color: #2f8f5f; }
    #auth-status-btn[data-state="ok"] .dot { background: #3ecf7e; }
    #auth-status-btn[data-state="error"] { border-color: #6b3a2a; }
    #auth-status-btn[data-state="error"] .dot { background: #e5734a; }
    main { width: min(100%, 520px); margin: 0 auto; }
    .eyebrow { margin: 0 0 10px; color: #727272; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 28px; color: #f3f3f3; font-size: 28px; font-weight: 500; }
    #status { margin: 0 0 18px; color: #9b9b9b; font-size: 13px; }
    .nft-card { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 0; border-top: 1px solid #202020; }
    .nft-card:last-child { border-bottom: 1px solid #202020; }
    .nft-name { margin: 0 0 7px; color: #f1f1f1; font-size: 16px; font-weight: 400; }
    .nft-price, .nft-remaining { margin: 0; color: #828282; font-size: 13px; }
    .nft-remaining { margin-top: 3px; }
    .mint-button { min-width: 68px; padding: 9px 14px; background: #141414; border: 1px solid #2a2a2a; border-radius: 7px; font-size: 13px; }
    .mint-button:disabled { cursor: default; opacity: .4; }
    .catalog-message { color: #777; font-size: 14px; }
    #debug-report {
      margin-top: 28px;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      background: #0d0d0d;
      overflow: hidden;
    }
    #debug-report-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid #202020;
    }
    #debug-report-header span { font-size: 12px; color: #9b9b9b; letter-spacing: .08em; text-transform: uppercase; }
    #debug-report-header div { display: flex; gap: 8px; }
    #debug-report-header button {
      padding: 6px 10px;
      font-size: 12px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: inherit;
    }
    #debug-report-content {
      margin: 0;
      padding: 14px;
      max-height: 45vh;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.5;
      color: #c6c6c6;
    }
  </style>
</head>
<body>
  <button id="wallet-btn" type="button">Connect Wallet</button>
  <button id="auth-status-btn" type="button" data-state="checking" title="Checking...">
    <span class="dot"></span>
    <span id="auth-status-label">Checking...</span>
  </button>
  <main>
    <p class="eyebrow">Collection</p>
    <h1>Minting</h1>
    <p id="status" role="status" hidden></p>
    <section id="catalog" aria-live="polite"></section>
    <section id="debug-report" hidden>
      <div id="debug-report-header">
        <span>Debug report (ultimo tentativo di mint)</span>
        <div>
          <button id="debug-report-copy" type="button">Copy report</button>
          <button id="debug-report-close" type="button">Close</button>
        </div>
      </div>
      <pre id="debug-report-content"></pre>
    </section>
    <p style="margin-top: 24px; text-align: center;">
      <button id="withdraw-btn" type="button" style="padding: 8px 14px; font-size: 12px; background: #141414; border: 1px solid #2a2a2a; border-radius: 7px; color: #828282;">
        Withdraw collection funds (owner only)
      </button>
    </p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
