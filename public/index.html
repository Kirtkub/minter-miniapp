<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mint</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-width: 100%;
      min-height: 100%;
      background: #050505;
      color: #cfcfcf;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Extra bottom padding makes room for the fixed bottom nav bar. */
    body {
      min-height: 100dvh;
      padding: max(76px, calc(56px + env(safe-area-inset-top))) 20px max(104px, calc(84px + env(safe-area-inset-bottom)));
    }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* --- Icons (monochrome PNGs tinted via CSS mask, so one asset works
       for every color state) --------------------------------------------- */
    .icon-mask {
      display: inline-block;
      flex: none;
      background-color: currentColor;
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
    }
    .icon-wallet {
      -webkit-mask-image: url('/icons/icon-wallet.png');
      mask-image: url('/icons/icon-wallet.png');
    }
    .icon-mint-and-reveal {
      -webkit-mask-image: url('/icons/icon-mint-and-reveal.png');
      mask-image: url('/icons/icon-mint-and-reveal.png');
    }
    .icon-my-collection {
      -webkit-mask-image: url('/icons/icon-my-collection.png');
      mask-image: url('/icons/icon-my-collection.png');
    }

    /* --- Wallet connect button (top right, fixed) ----------------------- */
    #wallet-btn {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      background: #141414;
      border: 1px solid #5a5a5a;
      border-radius: 8px;
      color: #cfcfcf;
      z-index: 20;
    }
    #wallet-btn:active { background: #1c1c1c; }
    #wallet-btn .icon-wallet { width: 15px; height: 15px; }
    #wallet-btn.connected { border-color: #3ecf7e; color: #fff; }

    #auth-status-btn {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      padding: 10px 16px;
      font-size: 13px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 7px;
      z-index: 20;
    }
    #auth-status-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: #6a6a6a; flex: none; }
    #auth-status-btn[data-state="checking"] .dot { background: #6a6a6a; }
    #auth-status-btn[data-state="ok"] { border-color: #2f8f5f; }
    #auth-status-btn[data-state="ok"] .dot { background: #3ecf7e; }
    #auth-status-btn[data-state="error"] { border-color: #6b3a2a; }
    #auth-status-btn[data-state="error"] .dot { background: #e5734a; }

    main { width: min(100%, 520px); margin: 0 auto; }
    .page[hidden] { display: none; }
    .eyebrow { margin: 0 0 10px; color: #727272; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 28px; color: #f3f3f3; font-size: 28px; font-weight: 500; }
    #status { margin: 0 0 18px; color: #9b9b9b; font-size: 13px; }
    .nft-card { display: flex; flex-direction: column; gap: 4px; padding: 24px 0; border-top: 1px solid #202020; }
    .nft-card:last-child { border-bottom: 1px solid #202020; }
    .nft-image { width: 100%; aspect-ratio: 1 / 1; border-radius: 16px; object-fit: cover; background: #141414; margin-bottom: 10px; }
    .nft-name { margin: 0; color: #f3f3f3; font-size: 20px; font-weight: 500; }
    .nft-price { display: flex; align-items: center; gap: 7px; margin: 6px 0 0; }
    .gram-icon { display: inline-flex; flex: none; }
    .gram-icon svg { display: block; }
    .price-amount { font-weight: 700; font-size: 18px; color: #f3f3f3; }
    .price-usd { font-weight: 400; font-size: 13px; color: #8c8c8c; }
    .nft-remaining { margin: 4px 0 0; color: #909090; font-size: 14px; }
    .nft-countdown { margin: 6px 0 14px; font-weight: 700; font-size: 15px; color: #e3b341; }

    /* Mint button: solid blue, per the collection's accent color. */
    .mint-button {
      width: 100%;
      padding: 16px;
      background: #30A1F5;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }
    .mint-button:active { background: #2790dd; }
    .mint-button:disabled { cursor: default; opacity: .6; }
    /* Already owns a copy: "Mint another copy" in yellow. */
    .mint-button.owned { background: #e3b341; color: #1a1400; }
    .mint-button.owned:active { background: #cf9f2f; }
    .open-in-collection { margin: 12px 0 0; text-align: center; font-size: 14px; }
    .open-in-collection a { color: #30A1F5; text-decoration: underline; cursor: pointer; }

    .catalog-message { color: #777; font-size: 14px; }

    /* --- My Collection (revealed/private images) ------------------------- */
    .my-card { display: flex; flex-direction: column; gap: 4px; padding: 24px 0; border-top: 1px solid #202020; }
    .my-card:last-child { border-bottom: 1px solid #202020; }
    .my-image-btn {
      display: block;
      width: 100%;
      padding: 0;
      border: none;
      background: none;
      cursor: zoom-in;
    }
    .my-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      object-fit: cover;
      background: #141414;
      margin-bottom: 10px;
      display: block;
    }
    .my-name { margin: 0 0 12px; color: #f3f3f3; font-size: 20px; font-weight: 500; }
    .my-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .my-actions button {
      flex: 1 1 auto;
      min-width: 120px;
      padding: 13px 14px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }
    .btn-getgems { background: #1c1c1c; border: 1px solid #3a3a3a; color: #cfcfcf; }
    .btn-getgems:active { background: #242424; }
    .btn-sell { background: #3ecf7e; color: #06210f; }
    .btn-sell:active { background: #36b96f; }
    .btn-download { background: #30A1F5; color: #fff; flex-basis: 100%; }
    .btn-download:active { background: #2790dd; }
    .btn-download:disabled, .my-actions button:disabled { opacity: .55; cursor: default; }

    /* Lightbox: fullscreen view of the revealed image at its original
       aspect ratio (contain, not the feed's square crop). */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, .92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #lightbox[hidden] { display: none; }
    #lightbox-image { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
    #lightbox-close {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid #3a3a3a;
      background: #141414;
      color: #cfcfcf;
      font-size: 16px;
      line-height: 1;
    }
    #debug-report {
      margin-top: 28px;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      background: #0d0d0d;
      overflow: hidden;
    }
    #debug-report-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid #202020;
    }
    #debug-report-header span { font-size: 12px; color: #9b9b9b; letter-spacing: .08em; text-transform: uppercase; }
    #debug-report-header div { display: flex; gap: 8px; }
    #debug-report-header button {
      padding: 6px 10px;
      font-size: 12px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: inherit;
    }
    #debug-report-content {
      margin: 0;
      padding: 14px;
      max-height: 45vh;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.5;
      color: #c6c6c6;
    }
    /* :not([hidden]) keeps this rule's specificity from beating the browser's
       default `[hidden] { display: none }` rule — a plain `#withdraw-btn { display: block }`
       would override [hidden] (ID selector beats attribute selector) and show
       the button even while it's supposed to be hidden. */
    #withdraw-btn:not([hidden]) {
      margin-top: 24px;
      padding: 8px 14px;
      font-size: 12px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 7px;
      color: #828282;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /* --- Bottom navigation (fixed, centered, independent of scroll) -----
       Compact by default: icons only, so the bar stays small and out of
       the way. Labels reveal themselves while the user scrolls down, then
       fade back out ~2s after scrolling stops (see initNav in app.js). */
    #bottom-nav {
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      padding: 6px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 18px;
      z-index: 20;
      transition: border-radius .2s ease;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 11px;
      background: transparent;
      border: none;
      border-radius: 13px;
      color: #7a7a7a;
      font-size: 11px;
      font-weight: 500;
      transition: color .15s ease, background-color .15s ease, padding .2s ease;
    }
    .nav-btn:active { background: #1c1c1c; }
    .nav-btn.active { color: #f3f3f3; background: #1e1e1e; }
    .nav-btn .icon-mask { width: 21px; height: 21px; flex: none; }
    .nav-btn span:last-child {
      display: inline-block;
      max-width: 0;
      overflow: hidden;
      white-space: nowrap;
      opacity: 0;
      transition: max-width .2s ease, opacity .15s ease, margin-left .2s ease;
    }
    /* When the "labels" state is toggled on (via JS, while scrolling down),
       expand each label back into view. */
    #bottom-nav.show-labels .nav-btn { padding: 9px 14px; }
    #bottom-nav.show-labels .nav-btn span:last-child {
      max-width: 140px;
      opacity: 1;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <button id="wallet-btn" type="button">
    <span class="icon-mask icon-wallet" aria-hidden="true"></span>
    <span id="wallet-btn-label">Connect Wallet</span>
  </button>
  <button id="auth-status-btn" type="button" data-state="checking" title="Checking...">
    <span class="dot"></span>
    <span id="auth-status-label">Checking...</span>
  </button>
  <main>
    <section id="page-mint" class="page" data-page="mint">
      <p class="eyebrow">Collection</p>
      <h1>Mint and Reveal</h1>
      <p id="status" role="status" hidden></p>
      <section id="catalog" aria-live="polite"></section>
      <section id="debug-report" hidden>
        <div id="debug-report-header">
          <span>Debug report (last mint attempt)</span>
          <div>
            <button id="debug-report-copy" type="button">Copy report</button>
            <button id="debug-report-close" type="button">Close</button>
          </div>
        </div>
        <pre id="debug-report-content"></pre>
      </section>
      <button id="withdraw-btn" type="button" hidden>Withdraw collection funds (owner only)</button>
    </section>

    <section id="page-collection" class="page" data-page="collection" hidden>
      <p class="eyebrow">Collection</p>
      <h1>My Collection</h1>
      <p id="collection-status" role="status" hidden></p>
      <section id="my-collection" aria-live="polite"></section>
    </section>
  </main>

  <!-- Fullscreen lightbox for a revealed (private) NFT image, shown at its
       original aspect ratio (the feed thumbnail is square-cropped). -->
  <div id="lightbox" hidden>
    <button id="lightbox-close" type="button" aria-label="Close">✕</button>
    <img id="lightbox-image" alt="" />
  </div>

  <nav id="bottom-nav" aria-label="Primary">
    <button type="button" class="nav-btn active" data-page="mint" aria-current="page">
      <span class="icon-mask icon-mint-and-reveal" aria-hidden="true"></span>
      <span>Mint and Reveal</span>
    </button>
    <button type="button" class="nav-btn" data-page="collection">
      <span class="icon-mask icon-my-collection" aria-hidden="true"></span>
      <span>My Collection</span>
    </button>
  </nav>

  <script src="/app.js"></script>
</body>
</html>
