<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Wallet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    min-height: 100dvh;
    background: #050505;
    overflow: hidden;
  }
  #wallet-btn {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    padding: 10px 16px;
    font-size: 13px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #cfcfcf;
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  #wallet-btn:active {
    background: #1c1c1c;
  }
</style>
</head>
<body>
<button id="wallet-btn" type="button">Connect Wallet</button>
<script>
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try {
      tg.setHeaderColor('#050505');
      tg.setBackgroundColor('#050505');
    } catch (e) {}
  }

  var btn = document.getElementById('wallet-btn');

  function render(connected) {
    btn.textContent = connected ? 'Disconnect Wallet' : 'Connect Wallet';
  }

  var tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: window.location.origin + '/tonconnect-manifest.json'
  });

  tonConnectUI.connectionRestored.then(function () {
    render(tonConnectUI.connected);
  });

  tonConnectUI.onStatusChange(function (wallet) {
    render(!!wallet);
  });

  btn.addEventListener('click', function () {
    if (tonConnectUI.connected) {
      tonConnectUI.disconnect();
    } else {
      tonConnectUI.openModal();
    }
  });
</script>
</body>
</html>
